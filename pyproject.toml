[tool.poetry]
name = "pg-export-bytea"
version = "0.1.0"
description = "A CLI helping tool for exporting bytea fields of a PostgreSQL relation into files"
authors = ["Ospi LYON Industrialisation <industrialisation@ospi.fr>"]
license = "Commercial"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.8"
cleo = "^2.1.0"
coloredlogs = "^15.0.1"
psycopg = "^3.2.3"

[tool.poetry.group.dev.dependencies]
autopep8 = "2.3.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
pg_export_bytea = "pg_export_bytea:main"

